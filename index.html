
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KillaCode Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>KillaCode Tip Calculator</h1>
  <p>Calculate your tip and total bill.</p>

  <label for="bill">Bill amount ($)</label>
  <input type="number" id="bill" placeholder="Enter bill amount">

  <label for="tip">Tip percentage (%)</label>
  <input type="number" id="tip" value="20">

  <button onclick="calculateTip()">Calculate</button>

  <h2 id="result">Your total will appear here.</h2>

  <script>
    function calculateTip() {
      const bill = Number(document.getElementById("bill").value);
      const tip = Number(document.getElementById("tip").value);

      if (bill <= 0 || tip < 0) {
        document.getElementById("result").textContent =
          "Please enter valid amounts.";
        return;
      }

      const tipAmount = bill * (tip / 100);
      const total = bill + tipAmount;

      document.getElementById("result").textContent =
        "Tip: $" + tipAmount.toFixed(2) +
        " | Total: $" + total.toFixed(2);
    }
  </script>
</body>
</html>
