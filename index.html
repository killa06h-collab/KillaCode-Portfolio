
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KillaCode | Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="calculator">
    <h1>KillaCode 💜</h1>
    <p>Smart Tip Calculator</p>

    <label for="bill">Bill Amount ($)</label>
    <input type="number" id="bill" placeholder="100.00" min="0" step="0.01">

    <label>Choose Your Tip</label>
    <div class="tip-options">
      <button class="preset" data-tip="15">15%</button>
      <button class="preset" data-tip="18">18%</button>
      <button class="preset active" data-tip="20">20%</button>
      <button class="preset" data-tip="25">25%</button>
    </div>

    <label for="tip">Custom Tip (%)</label>
    <input type="number" id="tip" value="20" min="0" max="100">

    <label for="people">Split Between People</label>
    <input type="number" id="people" value="1" min="1" step="1">

    <button id="calculate">Calculate Total</button>
    <button id="reset" class="reset">Reset</button>

    <section id="results" aria-live="polite">
      <h2>Your Results</h2>
      <p>Tip: <span id="tipAmount">$0.00</span></p>
      <p>Total: <span id="total">$0.00</span></p>
      <p>Each Person: <span id="each">$0.00</span></p>
    </section>
  </main>

  <script>
    const billInput = document.getElementById("bill");
    const tipInput = document.getElementById("tip");
    const peopleInput = document.getElementById("people");

    document.querySelectorAll(".preset").forEach(button => {
      button.addEventListener("click", () => {
        tipInput.value = button.dataset.tip;

        document.querySelectorAll(".preset")
          .forEach(item => item.classList.remove("active"));

        button.classList.add("active");
      });
    });

    document.getElementById("calculate")
      .addEventListener("click", () => {

        const bill = Number(billInput.value);
        const tip = Number(tipInput.value);
        const people = Number(peopleInput.value);

        if (
          billInput.value.trim() === "" ||
          tipInput.value.trim() === "" ||
          peopleInput.value.trim() === "" ||
          !Number.isFinite(bill) ||
          !Number.isFinite(tip) ||
          !Number.isFinite(people) ||
          bill <= 0 ||
          tip < 0 || tip > 100 ||
          people < 1 || !Number.isInteger(people)
        ) {
          alert("Please enter valid amounts.");
          return;
        }

        const tipAmount = bill * tip / 100;
        const total = bill + tipAmount;
        const each = total / people;

        document.getElementById("tipAmount").textContent =
          "$" + tipAmount.toFixed(2);

        document.getElementById("total").textContent =
          "$" + total.toFixed(2);

        document.getElementById("each").textContent =
          "$" + each.toFixed(2);
      });

    document.getElementById("reset")
      .addEventListener("click", () => {
        billInput.value = "";
        tipInput.value = "20";
        peopleInput.value = "1";

        document.querySelectorAll(".preset")
          .forEach(item => item.classList.remove("active"));

        document.querySelector('[data-tip="20"]')
          .classList.add("active");

        document.getElementById("tipAmount").textContent = "$0.00";
        document.getElementById("total").textContent = "$0.00";
        document.getElementById("each").textContent = "$0.00";
      });
  </script>
</body>
</html>
